[CLIENT]
; ============================================================
;  HTTP BACKUP CLIENT - Konfigurasi Sisi Server Backup
; ============================================================

; URL HTTP Backup Server yang berjalan di server sumber.
; Format: http://IP_SERVER:PORT
; Contoh: http://192.168.1.100:8765
;ServerUrl = http://192.168.1.100:8765
ServerUrl = http://192.168.1.100/backup

; Token rahasia untuk autentikasi ke server.
; Harus SAMA PERSIS dengan AuthToken di server_config.ini
AuthToken = sfQpJMHZdeo15GS02dpBgSWofxtjQPdz

; Direktori tujuan penyimpanan backup di server backup ini.
; Struktur penyimpanan: BackupDirectory\NamaSumber\relative\path\file
; Contoh: D:\Backup\Data\folder\file.xlsx
BackupDirectory = D:\Backup

; Mode backup: "incremental" atau "overwrite"
; - incremental (DEFAULT): Initial backup ke folder utama, backup berikutnya 
;   hanya file yang berubah ke folder dengan timestamp (incremental_YYYYMMDD_HHMMSS)
; - overwrite: Selalu backup ke folder utama dan overwrite file yang ada (mode lama)
BackupMode = incremental

; Path file log.
LogFile = backup_client.log

; Path database SQLite untuk melacak status backup setiap file.
; File ini yang menentukan apakah perlu initial backup atau incremental.
; Jangan hapus file ini kecuali ingin menjalankan initial backup ulang.
DatabaseFile = backup_state.db

; Jumlah thread untuk download concurrent. Default: 4
; Sesuaikan dengan bandwidth jaringan dan kapasitas server.
MaxWorkers = 4

; Jumlah percobaan ulang jika download file gagal. Default: 3
RetryCount = 3

; Jeda (detik) antar percobaan ulang. Default: 5
RetryDelay = 5

; Timeout (detik) untuk membuka koneksi ke server. Default: 30
ConnectionTimeout = 30

; Timeout (detik) untuk membaca data dari server.
; Perlu lebih besar untuk file-file yang sangat besar. Default: 300
ReadTimeout = 300
