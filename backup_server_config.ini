[SERVER]
; ============================================================
;  HTTP Backup Server - Konfigurasi PHP Edition
;  (Dibaca oleh backup_server.php)
;
;  PENTING: File ini TIDAK boleh bisa diakses via browser.
;  Sudah dilindungi oleh .htaccess — jangan hapus .htaccess.
;  Untuk keamanan maksimal, pindahkan file ini ke luar web root
;  dan ubah $config_file di backup_server.php ke path absolutnya.
; ============================================================

; Token rahasia untuk autentikasi. WAJIB diganti dengan string acak yang kuat.
; Generate contoh (jalankan di server):
;   php -r "echo bin2hex(random_bytes(32));"
;   python -c "import secrets; print(secrets.token_hex(32))"
;
; Token ini harus SAMA PERSIS dengan AuthToken di client_config.ini
AuthToken = sfQpJMHZdeo15GS02dpBgSWofxtjQPdz

; Path file log. Path relatif terhadap direktori backup_server.php.
; Atau gunakan path absolut: C:\Apache24\logs\backup_server.log
LogFile = backup_server.log

; Daftar direktori sumber yang akan di-expose via HTTP.
; Format: NamaSumber=D:\PathFolder
; Pisahkan beberapa direktori dengan titik koma (;)
; Nama tidak boleh mengandung spasi atau karakter '=' dan ';'
;
; Contoh (Windows):
;   SourceDirectories = Data=D:\Data;Projects=D:\Projects
; Contoh (Linux):
;   SourceDirectories = Data=/srv/data;Documents=/home/user/documents
SourceDirectories = Data=D:\Data 
;SourceDirectories = Data=D:\Data;Documents=D:\Documents

[FILTERS]
; ============================================================
;  Filter File yang Dikecualikan dari Backup
; ============================================================

; Ekstensi file yang dikecualikan. Pisahkan dengan titik koma.
ExcludeExtensions = .tmp;.bak;.log;.temp;.swp;.lock

; Nama folder yang dikecualikan. Berlaku rekursif di semua level.
ExcludeFolders = temp;cache;node_modules;.git;$RECYCLE.BIN;System Volume Information;__pycache__
