[SERVER]
; ============================================================
;  HTTP BACKUP SERVER - Konfigurasi Sisi Server Sumber
; ============================================================

; IP address untuk listen. Gunakan 0.0.0.0 untuk semua interface,
; atau spesifik IP seperti 192.168.1.100 untuk interface tertentu.
Host = 0.0.0.0

; Port HTTP server. Pastikan port ini tidak diblokir firewall.
; Buka port di Windows Firewall:
;   netsh advfirewall firewall add rule name="BackupServer" dir=in action=allow protocol=TCP localport=8765
Port = 8765

; Token rahasia untuk autentikasi. WAJIB diganti dengan string acak yang kuat.
; Gunakan minimal 32 karakter. Contoh generate: python -c "import secrets; print(secrets.token_hex(32))"
; Token ini harus SAMA persis dengan AuthToken di client_config.ini
AuthToken = ganti_token_ini_dengan_string_rahasia_minimal_32_karakter

; Path file log. Bisa path absolut atau relatif terhadap direktori program.
LogFile = backup_server.log

; Daftar direktori sumber yang akan di-expose via HTTP.
; Format: NamaSumber=D:\PathFolder
; Pisahkan beberapa direktori dengan titik koma (;)
; Nama tidak boleh mengandung spasi atau karakter khusus.
; Contoh:
;   SourceDirectories = Data=D:\Data;Projects=D:\Projects;Shared=\\SERVER\Share
SourceDirectories = Data=D:\Data;Documents=D:\Documents

[FILTERS]
; ============================================================
;  Filter File yang Dikecualikan dari Backup
; ============================================================

; Ekstensi file yang dikecualikan. Pisahkan dengan titik koma.
ExcludeExtensions = .tmp;.bak;.log;.temp;.swp;.lock

; Nama folder yang dikecualikan. Berlaku rekursif di semua level.
ExcludeFolders = temp;cache;node_modules;.git;$RECYCLE.BIN;System Volume Information;__pycache__
